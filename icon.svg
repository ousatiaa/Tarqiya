<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e5f3a"/>
      <stop offset="100%" stop-color="#2d8a54"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- book -->
  <g transform="translate(256,300)">
    <path d="M-110,-40 Q-110,-70 -80,-70 L-10,-70 L-10,60 Q-40,40 -80,40 Q-110,40 -110,10 Z" fill="#ffffff" opacity="0.95"/>
    <path d="M110,-40 Q110,-70 80,-70 L10,-70 L10,60 Q40,40 80,40 Q110,40 110,10 Z" fill="#ffffff" opacity="0.95"/>
    <line x1="0" y1="-70" x2="0" y2="60" stroke="#1e5f3a" stroke-width="4"/>
  </g>
  <!-- graduation cap -->
  <g transform="translate(256,170)">
    <polygon points="-130,0 0,-50 130,0 0,50" fill="#ffffff"/>
    <rect x="-30" y="0" width="60" height="40" rx="6" fill="#ffffff" opacity="0.85"/>
    <line x1="130" y1="0" x2="130" y2="70" stroke="#d4a017" stroke-width="6" stroke-linecap="round"/>
    <circle cx="130" cy="78" r="12" fill="#d4a017"/>
  </g>
  <!-- upward arrow (promotion) -->
  <g transform="translate(256,230)" fill="#d4a017">
    <path d="M0,-30 L24,0 L12,0 L12,30 L-12,30 L-12,0 L-24,0 Z"/>
  </g>
</svg>